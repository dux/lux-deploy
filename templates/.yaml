# lux-deploy config. `server` and `domain` are required.
# Any non-behavioral key becomes an UPPERCASE {{KEY}} placeholder available
# to every template under config/deploy/.

server: srv.example.com
domain: example.com

# Optional post-deploy verification now belongs in remote_after.sh.
# If config/deploy/remote_after.sh exists and exits non-zero, the deploy
# command fails after the new release is already live.

# Engine defaults (uncomment to override):
# service_user:       deployer
# remote_base:        /home/deployer/apps
# service_prefix:     web                     # systemd unit: <prefix>-<app>.service
# job_service_prefix:                         # nil disables job.service
