({{TAG}}_security_filter) {
  @blocked {
    path *.php
    path /wp-*
    path /wordpress/*
    path /.env
    path /.git/*
    path /config/*
    path /phpmyadmin*
    path /.aws/*
    path /.ssh/*
    path /actuator/*
  }

  handle @blocked {
    respond "not found" 404
  }
}

{{DOMAIN}} {
  import {{TAG}}_security_filter

  # PORT is stable across deploys, so a restart is a gap on the same upstream
  # rather than a switch to a new one. lb_try_duration holds the request open
  # through that gap instead of returning 502.
  reverse_proxy localhost:{{PORT}} {
    lb_try_duration 10s
    lb_try_interval 250ms
  }

  # JSON access log -> shared dir; the lux-caddylog importer tails this into
  # caddy.sqlite. mode 0644 so the service-user importer can read it.
  log {
    output file {{LOG_DIR}}/{{LOG_NAME}}.jsonl {
      mode 0644
      roll_size 1GiB
      roll_keep 48
      roll_keep_for 168h
      roll_uncompressed
    }
    format json
  }
}
