({{TAG}}_security_filter) {
  @blocked {
    path *.php
    path /wp-*
    path /wordpress/*
    path /.env
    path /.git/*
    path /config/*
    path /phpmyadmin*
    path /.aws/*
    path /.ssh/*
    path /actuator/*
  }

  handle @blocked {
    respond "not found" 404
  }
}

{{DOMAIN}} {
  import {{TAG}}_security_filter
  reverse_proxy localhost:{{PORT}}

  # JSON access log -> shared dir; the lux-caddylog importer tails this into
  # caddy.sqlite. mode 0644 so the service-user importer can read it.
  log {
    output file {{LOG_DIR}}/{{LOG_NAME}}.jsonl {
      mode 0644
      roll_size 1GiB
      roll_keep 48
      roll_keep_for 168h
      roll_uncompressed
    }
    format json
  }
}
